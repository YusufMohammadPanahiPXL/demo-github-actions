name: "Hoofdstuk 3 - Alle Oefeningen (CI in Github Actions)"

# Triggers voor alle oefeningen uit Lab 3:
# - push naar main branch
# - git tag releases (v*.*.*) voor Exercise 2
# - pull_request naar main voor Exercise 1, 3 en 4
# - workflow_dispatch (manuele knop)
on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # EXTRA OEFENING 4: Linting & Code Quality (Parallel Job)
  # - Draait parallel met de test- en buildjobs
  # - ESLint check (npm run lint)
  # - Prettier formatting check (npm run format:check)
  # - Security audit (npm audit)
  # =========================================================================
  code-quality:
    name: "Lab 3 Extra 4: Code Quality & Security Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: ESLint Code Quality Check
        run: npm run lint --if-present

      - name: Prettier Code Format Check
        run: npm run format:check --if-present

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high --production

  # =========================================================================
  # BASIS LAB & EXTRA OEFENING 1: Complete CI Workflow voor NodeJS
  # - Checkout
  # - Setup Node.js v20 met npm cache
  # - npm install
  # - npm test (Unit tests)
  # - Better Test Reporting (dorny/test-reporter)
  # - Bundle release (zip)
  # - Upload Test Report Artifact
  # =========================================================================
  ci-nodejs-pipeline:
    name: "Lab 3 Basis & Extra 1: CI Pipeline & Test Artifacts"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Test the code
        run: npm test

      - name: Publish Test Report Summary (JUnit XML)
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: coverage/junit.xml
          reporter: jest-junit

      - name: Build the code (Zip package met code en node_modules)
        run: zip -r release.zip . -x "*.git*"

      - name: Archive Test Results Artifact (Extra 1)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-results
          path: |
            coverage/
            release.zip
          retention-days: 7

  # =========================================================================
  # BASIS LAB & EXTRA OEFENING 2: Docker Build, Push & Scout Scan
  # - Login via GitHub Secrets (DOCKERHUB_USERNAME en DOCKERHUB_TOKEN)
  # - Setup Docker Buildx
  # - Metadata extractie (latest voor main, git tag voor release)
  # - Bouwen en pushen van Docker image
  # - Docker Scout CVE vulnerability scan
  # =========================================================================
  docker-build-and-push:
    name: "Lab 3 Basis & Extra 2: Docker Hub & Scout CVE Scan"
    needs: [ci-nodejs-pipeline]
    runs-on: ubuntu-latest
    # Voer uit bij push op main, tag of handmatige dispatch
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/calculator-app
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Docker Scout CVE Security Scan (Extra 2)
        uses: docker/scout-action@v1
        continue-on-error: true
        with:
          command: cves
          image: ${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:latest
          only-severities: critical,high
          exit-code: false

  # =========================================================================
  # EXTRA OEFENING 3: Discord Notificaties & PR Comments
  # - Draait na alle jobs (needs: [ci-nodejs-pipeline, docker-build-and-push])
  # - Discord Webhook trigger (status, branch, repo)
  # - PR comment plaatsen bij pull requests met peter-evans/create-or-update-comment
  # =========================================================================
  notifications-and-pr-feedback:
    name: "Lab 3 Extra 3: Discord Notifications & PR Comments"
    needs: [ci-nodejs-pipeline, docker-build-and-push]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Stap A: Comment op Pull Request (als de run getriggerd werd door een PR)
      - name: Comment on Pull Request
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### 🤖 CI Pipeline Status: **${{ needs.ci-nodejs-pipeline.result == 'success' && 'PASSED ✅' || 'FAILED ❌' }}**
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.head_ref }}`
            - **Unit Tests:** ${{ needs.ci-nodejs-pipeline.result }}
            - **Docker Build:** ${{ needs.docker-build-and-push.result }}

      # Stap B: Discord Webhook Notificatie (bij main branch of PR)
      - name: Send Discord Notification
        if: (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          STATUS="${{ needs.ci-nodejs-pipeline.result == 'success' && needs.docker-build-and-push.result == 'success' && 'SUCCESVOL ✅' || 'GEFAALD ❌' }}"
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"📢 **CI Run Overzicht**\n• **Status:** ${STATUS}\n• **Repository:** ${{ github.repository }}\n• **Branch:** ${{ github.ref_name }}\n• **Trigger:** ${{ github.event_name }}\n• **Auteur:** ${{ github.actor }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK }}"
